# Hardware configuration for protoflow-main-app
# This file defines hardware resources managed by the main application

# Serial ports
[serial.usb0]
device = /dev/ttyUSB0
mode = exclusive
timeout = 30s

# I2C buses
[i2c.bus1]
device = /dev/i2c-1
mode = shared
max_clients = 4

# SPI devices
[spi.dev0]
device = /dev/spidev0.0
mode = exclusive
timeout = 10s

# GPIO pins
[gpio.pin23]
pin = 23
mode = exclusive
direction = output

[gpio.pin24]
pin = 24
mode = shared
direction = input
