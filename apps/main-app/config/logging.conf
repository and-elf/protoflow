# Protoflow Logging Configuration

[logging]
# Minimum log level: trace, debug, info, warn, error, fatal
min_level = info

# Maximum number of logs to store in memory (0 = unlimited)
max_stored_logs = 1000

# Enable console output
console_output = true

# File sink example
[sink.file]
type = file
path = /var/log/protoflow/main-app.log
min_level = debug

